stage: 7
dataset: D06_early_autism
experiment: set_all
experiment_note: features per columns.yaml
model_id: logreg
fold: 2
seed: 44
feature_set: set_all
numeric_features:
- Age
- Social_Interaction_Score
- Communication_Score
- Repetitive_Behavior_Score
categorical_features:
- Gender
- Jaundice
- Family_ASD_History
- Language_Delay
model:
  class: LogisticRegression
  params:
    C: 1.0
    class_weight: balanced
    max_iter: 5000
  note: L2 (default)
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  C: 1.0
  class_weight: balanced
  dual: false
  fit_intercept: true
  intercept_scaling: 1
  l1_ratio: 0.0
  max_iter: 5000
  n_jobs: null
  penalty: deprecated
  random_state: 44
  solver: lbfgs
  tol: 0.0001
  verbose: 0
  warm_start: false
