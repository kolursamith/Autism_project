stage: 7
dataset: D04_autism_prediction
experiment: set_all
experiment_note: features per columns.yaml (A1-A10 scores, age, result, demographics);
  test.csv (unlabelled) never read
model_id: dummy_majority
fold: 1
seed: 43
feature_set: set_all
numeric_features:
- A1_Score
- A2_Score
- A3_Score
- A4_Score
- A5_Score
- A6_Score
- A7_Score
- A8_Score
- A9_Score
- A10_Score
- age
- result
categorical_features:
- gender
- ethnicity
- jaundice
- austim
- contry_of_res
- used_app_before
- relation
model:
  class: DummyClassifier
  params:
    strategy: most_frequent
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  constant: null
  random_state: null
  strategy: most_frequent
