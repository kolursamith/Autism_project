# D04 autism prediction - Stage 2 cleaning (DD-08). Tabular baselines only. Used by src/data/tabular.py
dataset_id: D04_autism_prediction
seed: 42
file: train.csv                  # the 800 labelled rows; test.csv (unlabelled) is never read
id_column: ID
sample_prefix: "D04_"
label: {column: Class/ASD, positive: ["1"], negative: ["0"]}
missing_tokens: ["?"]
numeric: [A1_Score, A2_Score, A3_Score, A4_Score, A5_Score, A6_Score, A7_Score, A8_Score, A9_Score, A10_Score, age, result]
categorical: [gender, ethnicity, jaundice, austim, contry_of_res, used_app_before, relation]
excluded:
  age_desc: "constant ('18 and more' in all rows) - carries no information"
result_column_test:
  column: result
  items: [A1_Score, A2_Score, A3_Score, A4_Score, A5_Score, A6_Score, A7_Score, A8_Score, A9_Score, A10_Score]
  # decision rule (brief): if 'result' is a direct function of A1-A10 -> exclude it from features, keep A1-A10.
  # Stage 2 test result: NOT a function (see cache/D04_autism_prediction/result_column_test.json) -> kept as a feature.
