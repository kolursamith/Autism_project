stage: 7
dataset: D04_autism_prediction
experiment: set_all
experiment_note: features per columns.yaml (A1-A10 scores, age, result, demographics);
  test.csv (unlabelled) never read
model_id: mlp
fold: 3
seed: 45
feature_set: set_all
numeric_features:
- A1_Score
- A2_Score
- A3_Score
- A4_Score
- A5_Score
- A6_Score
- A7_Score
- A8_Score
- A9_Score
- A10_Score
- age
- result
categorical_features:
- gender
- ethnicity
- jaundice
- austim
- contry_of_res
- used_app_before
- relation
model:
  class: MLPClassifier
  params:
    hidden_layer_sizes:
    - 64
    - 32
  early_stopping:
    monitor: val_roc_auc
    data: fold VALIDATION part only
    patience: 10
    min_delta: 0.0001
    max_epochs: 200
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  hidden_layer_sizes:
  - 64
  - 32
  max_epochs: 200
  min_delta: 0.0001
  patience: 10
  random_state: 45
