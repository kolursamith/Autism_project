model_id: M04
name: ConvNeXt + BiLSTM + Attention
seed: 51
encoder:
  type: timm
  timm_name: convnext_tiny.in12k_ft_in1k
  family: convnext
  input_size:
    sequence: 224
    tokens: 224
projection:
  d: 256
  dropout: 0.3
temporal:
  type: bilstm
  hidden: 128
pooling: attention
head:
  type: linear
  dropout: 0.3
  attention_hidden: 128
  mlp_hidden: 128
policy:
  sequence: frozen
  tokens: last_stage
lr:
  head_lr: 0.0005
  backbone_lr: 0.0
batch_size:
  sequence: 64
  tokens: 64
training:
  protocol_version: 1
  seed_base: 42
  optimizer:
    name: AdamW
    weight_decay: 0.01
  lr:
    head_lr_pretrained: 0.0005
    head_lr_custom_cnn: 0.001
    backbone_lr_factor_last_stage: 0.1
    backbone_lr_factor_full: 1.0
  schedule:
    name: cosine
    warmup_epochs: 2
  max_epochs: 40
  early_stopping:
    monitor: val_roc_auc
    mode: max
    patience: 8
    min_delta: 0.0001
  checkpoint:
    keep: best_val_auc
    last: every_epoch
    delete_last_when_done: true
  loss:
    name: BCEWithLogits
    pos_weight: n_neg_over_n_pos_train
  grad_clip_norm: 1.0
  amp: true
  cudnn_benchmark: true
  deterministic: false
  batch_size: from_model_config
  num_workers: auto
  pin_memory: true
  thresholds:
    primary: 0.5
    secondary: youden_j_on_validation
data:
  D01_eye_tracking:
    mode: sequence
    augmentation: none
    frozen_backbone_input: cached_features
    trainable_backbone_input: clips
    child_level: mean_clip_probability
run:
  dataset: D01_eye_tracking
  model_id: M04
  fold: 9
  mode: sequence
  policy: frozen
  batch_size: 64
  input: cached_features
