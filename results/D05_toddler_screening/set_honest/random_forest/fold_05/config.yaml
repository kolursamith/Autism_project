stage: 7
dataset: D05_toddler_screening
experiment: set_honest
experiment_note: A1-A10 and Qchat-10-Score removed (age, sex, ethnicity, jaundice,
  family history, respondent)
model_id: random_forest
fold: 5
seed: 47
feature_set: set_honest
numeric_features:
- Age_Mons
categorical_features:
- Sex
- Ethnicity
- Jaundice
- Family_mem_with_ASD
- Who completed the test
model:
  class: RandomForestClassifier
  params:
    n_estimators: 500
    class_weight: balanced_subsample
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  bootstrap: true
  ccp_alpha: 0.0
  class_weight: balanced_subsample
  criterion: gini
  max_depth: null
  max_features: sqrt
  max_leaf_nodes: null
  max_samples: null
  min_impurity_decrease: 0.0
  min_samples_leaf: 1
  min_samples_split: 2
  min_weight_fraction_leaf: 0.0
  monotonic_cst: null
  n_estimators: 500
  n_jobs: 2
  oob_score: false
  random_state: 47
  verbose: 0
  warm_start: false
