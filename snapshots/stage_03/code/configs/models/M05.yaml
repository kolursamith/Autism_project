# M05 CNN + Transformer + MLP - Stage 3 model config (policy defaults are confirmed in Stage 4; batch_size set by scripts/03_profile_models.py)
model_id: M05
name: CNN + Transformer + MLP
seed: 42
encoder:
  type: custom_cnn
  channels:
  - 32
  - 64
  - 128
  - 256
  input_size:
    sequence: 112
    tokens: 224
projection:
  d: 256
  dropout: 0.3
temporal:
  type: transformer
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  ff_mult: 4
pooling: mean
head:
  type: mlp
  dropout: 0.3
  attention_hidden: 128
  mlp_hidden: 128
policy:
  sequence: full
  tokens: full
lr:
  head_lr: 0.001
  backbone_lr: 0.001
batch_size:
  sequence: 64
  tokens: 64
