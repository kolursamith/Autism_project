# M10 ResNet50 + BiLSTM + Transformer - Stage 3 model config (policy confirmed and lr mirrored from configs/training.yaml in Stage 4; batch_size set by scripts/03_profile_models.py)
model_id: M10
name: ResNet50 + BiLSTM + Transformer
seed: 42
encoder:
  type: timm
  timm_name: resnet50.a1_in1k
  family: resnet
  input_size:
    sequence: 224
    tokens: 224
projection:
  d: 256
  dropout: 0.3
temporal:
  type: bilstm_transformer
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  ff_mult: 4
  hidden: 128
pooling: mean
head:
  type: linear
  dropout: 0.3
  attention_hidden: 128
  mlp_hidden: 128
policy:
  sequence: frozen
  tokens: last_stage
lr:
  head_lr: 0.0005
  backbone_lr: 5.0e-05
batch_size:
  sequence: 64
  tokens: 64
