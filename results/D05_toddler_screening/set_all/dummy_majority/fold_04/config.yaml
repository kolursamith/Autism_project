stage: 7
dataset: D05_toddler_screening
experiment: set_all
experiment_note: 'LABEL-DEFINITIONAL UPPER BOUND: label == (A1..A10 sum >= 4); does
  NOT measure autism prediction'
model_id: dummy_majority
fold: 4
seed: 46
feature_set: set_all
numeric_features:
- A1
- A2
- A3
- A4
- A5
- A6
- A7
- A8
- A9
- A10
- Age_Mons
- Qchat-10-Score
categorical_features:
- Sex
- Ethnicity
- Jaundice
- Family_mem_with_ASD
- Who completed the test
model:
  class: DummyClassifier
  params:
    strategy: most_frequent
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  constant: null
  random_state: null
  strategy: most_frequent
