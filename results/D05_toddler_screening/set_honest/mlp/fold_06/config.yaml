stage: 7
dataset: D05_toddler_screening
experiment: set_honest
experiment_note: A1-A10 and Qchat-10-Score removed (age, sex, ethnicity, jaundice,
  family history, respondent)
model_id: mlp
fold: 6
seed: 48
feature_set: set_honest
numeric_features:
- Age_Mons
categorical_features:
- Sex
- Ethnicity
- Jaundice
- Family_mem_with_ASD
- Who completed the test
model:
  class: MLPClassifier
  params:
    hidden_layer_sizes:
    - 64
    - 32
  early_stopping:
    monitor: val_roc_auc
    data: fold VALIDATION part only
    patience: 10
    min_delta: 0.0001
    max_epochs: 200
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  hidden_layer_sizes:
  - 64
  - 32
  max_epochs: 200
  min_delta: 0.0001
  patience: 10
  random_state: 48
