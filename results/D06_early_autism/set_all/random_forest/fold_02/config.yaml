stage: 7
dataset: D06_early_autism
experiment: set_all
experiment_note: features per columns.yaml
model_id: random_forest
fold: 2
seed: 44
feature_set: set_all
numeric_features:
- Age
- Social_Interaction_Score
- Communication_Score
- Repetitive_Behavior_Score
categorical_features:
- Gender
- Jaundice
- Family_ASD_History
- Language_Delay
model:
  class: RandomForestClassifier
  params:
    n_estimators: 500
    class_weight: balanced_subsample
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  bootstrap: true
  ccp_alpha: 0.0
  class_weight: balanced_subsample
  criterion: gini
  max_depth: null
  max_features: sqrt
  max_leaf_nodes: null
  max_samples: null
  min_impurity_decrease: 0.0
  min_samples_leaf: 1
  min_samples_split: 2
  min_weight_fraction_leaf: 0.0
  monotonic_cst: null
  n_estimators: 500
  n_jobs: 2
  oob_score: false
  random_state: 44
  verbose: 0
  warm_start: false
