stage: 7
dataset: D04_autism_prediction
experiment: set_all
experiment_note: features per columns.yaml (A1-A10 scores, age, result, demographics);
  test.csv (unlabelled) never read
model_id: random_forest
fold: 4
seed: 46
feature_set: set_all
numeric_features:
- A1_Score
- A2_Score
- A3_Score
- A4_Score
- A5_Score
- A6_Score
- A7_Score
- A8_Score
- A9_Score
- A10_Score
- age
- result
categorical_features:
- gender
- ethnicity
- jaundice
- austim
- contry_of_res
- used_app_before
- relation
model:
  class: RandomForestClassifier
  params:
    n_estimators: 500
    class_weight: balanced_subsample
preprocessing:
  numeric:
  - SimpleImputer(strategy=median)
  - StandardScaler()
  categorical:
  - SimpleImputer(strategy=most_frequent)
  - OneHotEncoder(handle_unknown=ignore
  - dense)
thresholds:
  primary: 0.5
  secondary: youden_j_on_validation
n_jobs: 2
classifier_params:
  bootstrap: true
  ccp_alpha: 0.0
  class_weight: balanced_subsample
  criterion: gini
  max_depth: null
  max_features: sqrt
  max_leaf_nodes: null
  max_samples: null
  min_impurity_decrease: 0.0
  min_samples_leaf: 1
  min_samples_split: 2
  min_weight_fraction_leaf: 0.0
  monotonic_cst: null
  n_estimators: 500
  n_jobs: 2
  oob_score: false
  random_state: 46
  verbose: 0
  warm_start: false
